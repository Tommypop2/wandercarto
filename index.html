<style>
  :root{
    --paper:#f4efe4; --ink:#20211f; --mute:#8c8577; --line:#d8d0bd;
    --accent:#8a5a3a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:#141311; color:var(--paper);
    font-family: Georgia, 'Times New Roman', serif;
    min-height:100vh;
  }
  .wrap{max-width:1180px; margin:0 auto; padding:48px 28px 90px;}
  header{text-align:center; margin-bottom:36px;}
  .eyebrow{letter-spacing:6px; font-size:12px; color:#a49c86; text-transform:uppercase;}
  h1{font-size:40px; margin:10px 0 6px; letter-spacing:2px;}
  .sub{color:#9a9284; font-size:15px; max-width:560px; margin:0 auto;}

  .panel{
    background:#1c1b18; border:1px solid #333029; border-radius:2px;
    padding:28px; margin-bottom:28px;
  }

  #drop{
    border:1.5px dashed #4a473d; border-radius:2px; padding:46px 20px;
    text-align:center; cursor:pointer; transition:border-color .15s, background .15s;
  }
  #drop.hover{ border-color:var(--accent); background:#221f1a; }
  #drop p{ margin:6px 0; color:#b6ae9c; font-size:15px; }
  #drop .big{ font-size:19px; color:var(--paper); font-family: -apple-system, sans-serif; letter-spacing:.3px;}
  #fileInput{display:none;}

  #fileList{ margin-top:18px; font-size:13px; color:#9a9284; font-family:-apple-system,sans-serif; }
  #fileList div{ display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid #2a2822; }

  .controls{ display:flex; gap:18px; flex-wrap:wrap; align-items:flex-end; margin-top:20px; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:#8f8878; font-family:-apple-system,sans-serif; }
  select, input[type=text]{
    background:#141311; border:1px solid #3a372e; color:var(--paper);
    padding:9px 12px; font-family:-apple-system,sans-serif; font-size:14px; border-radius:2px; min-width:190px;
  }
  button{
    background:var(--accent); color:#f4efe4; border:none; padding:11px 22px;
    font-family:-apple-system,sans-serif; font-size:14px; letter-spacing:.4px; border-radius:2px;
    cursor:pointer; transition:background .15s;
  }
  button:hover{ background:#a06a44; }
  button:disabled{ background:#3a372e; color:#6c6858; cursor:not-allowed; }
  button.ghost{ background:transparent; border:1px solid #4a473d; color:#cfc8b6; }
  button.ghost:hover{ background:#221f1a; }

  #status{ font-family:-apple-system,sans-serif; font-size:13px; color:#9a9284; margin-top:14px; min-height:18px; }
  #status.live::before{ content:"● "; color:#7a9e6f; }
  #status.fallback::before{ content:"● "; color:#c99a4e; }

  #posterWrap{ text-align:center; }
  #posterWrap svg{ max-width:100%; height:auto; box-shadow:0 30px 70px rgba(0,0,0,.5); }
  .actions{ display:flex; gap:12px; justify-content:center; margin-top:22px; flex-wrap:wrap; }
  .hidden{ display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Wandercarto</div>
    <h1>GPX &rarr; Poster</h1>
    <div class="sub">Drop the GPX files from any ride, hike, run, or paddle — one day or many. Get a monochrome map, a real elevation profile, and hillshaded terrain built from open elevation data.</div>
  </header>

  <div class="panel">
    <div id="drop">
      <div class="big">Drop GPX files here</div>
      <p>or click to browse — multiple files OK, they'll be ordered by date/time</p>
      <input id="fileInput" type="file" accept=".gpx" multiple>
    </div>
    <div id="fileList"></div>

    <div class="controls">
      <div class="field">
        <label>Title</label>
        <input id="titleInput" type="text" placeholder="e.g. Ridgeline Traverse">
      </div>
      <div class="field">
        <label>Subtitle</label>
        <input id="subtitleInput" type="text" placeholder="e.g. Four days, self-supported">
      </div>
      <div class="field">
        <label>Aspect ratio</label>
        <select id="aspectSelect">
          <option value="2:3">2:3 Portrait (default)</option>
          <option value="4:5">4:5 Portrait</option>
          <option value="9:16">9:16 Portrait (Stories)</option>
          <option value="1:1">1:1 Square</option>
          <option value="3:2">3:2 Landscape</option>
          <option value="5:4">5:4 Landscape</option>
        </select>
      </div>
      <div class="field">
        <label>Map padding</label>
        <select id="padSelect">
          <option value="0.94">Tight</option>
          <option value="0.78">Medium</option>
          <option value="0.60">Wide</option>
          <option value="0.45">Very wide</option>
        </select>
      </div>
      <div class="field">
        <label>Route colour</label>
        <select id="paletteSelect">
          <option value="ink">Monochrome / ink</option>
          <option value="days">Day-by-day colours</option>
        </select>
      </div>
      <div class="field">
        <label>Roads &amp; places</label>
        <select id="roadSelect">
          <option value="on">Show (detail scales to trip size)</option>
          <option value="off">Hide</option>
        </select>
      </div>
      <div class="field">
        <label>Elevation profile</label>
        <select id="elevSelect">
          <option value="auto">Show (if the GPX has elevation)</option>
          <option value="off">Hide</option>
        </select>
      </div>
      <div class="field">
        <label>Units</label>
        <select id="unitSelect">
          <option value="metric">Metric (km / m)</option>
          <option value="imperial">Imperial (mi / ft)</option>
        </select>
      </div>
      <button id="buildBtn" disabled>Build poster</button>
    </div>
    <div id="status"></div>
  </div>

  <div class="panel hidden" id="posterPanel">
    <div id="posterWrap"></div>
    <div class="actions">
      <button id="downloadSvg">Download SVG</button>
      <select id="pngSizeSelect" title="PNG export size">
        <option value="2400">PNG · screen</option>
        <option value="4000" selected>PNG · print (4000 px)</option>
        <option value="6000">PNG · large (6000 px)</option>
      </select>
      <button id="downloadPng" class="ghost">Download PNG</button>
      <button id="rebuild" class="ghost">Rebuild with current settings</button>
    </div>
  </div>
</div>

<script>
/* ---------------- GPX parsing ---------------- */
/* Distance beyond which consecutive points are treated as a recording gap rather
   than travel — a dropout or a paused-and-moved recording, not a straight-line ride. */
const GAP_METRES = 5000;

function parseGPX(text, filename){
  const doc = new DOMParser().parseFromString(text, "application/xml");
  let sawElevation = false;

  const readPt = pt => {
    const eleEl = pt.querySelector("ele");
    const timeEl = pt.querySelector("time");
    const eleTxt = eleEl ? parseFloat(eleEl.textContent) : NaN;
    if(eleEl && Number.isFinite(eleTxt)) sawElevation = true;
    return {
      lat: parseFloat(pt.getAttribute("lat")),
      lon: parseFloat(pt.getAttribute("lon")),
      ele: Number.isFinite(eleTxt) ? eleTxt : 0,
      time: timeEl ? timeEl.textContent : null
    };
  };

  // Keep <trkseg> boundaries. Flattening them draws a straight line across every
  // pause or dropout and adds that phantom distance to the totals.
  let segments = Array.from(doc.querySelectorAll("trkseg"))
    .map(seg => Array.from(seg.querySelectorAll("trkpt")).map(readPt))
    .filter(seg => seg.length > 0);

  if(!segments.length){
    const all = Array.from(doc.querySelectorAll("trkpt")).map(readPt);
    if(all.length) segments = [all];
  }

  // Split further on implausible jumps inside a segment (GPS dropout).
  const split = [];
  for(const seg of segments){
    let cur = [seg[0]];
    for(let i=1;i<seg.length;i++){
      const d = haversine(seg[i-1].lat, seg[i-1].lon, seg[i].lat, seg[i].lon);
      if(d > GAP_METRES){ if(cur.length) split.push(cur); cur = [seg[i]]; }
      else cur.push(seg[i]);
    }
    if(cur.length) split.push(cur);
  }

  const points = split.flat();
  const nameEl = doc.querySelector("trk > name");
  const name = nameEl ? nameEl.textContent.trim() : filename.replace(/\.gpx$/i, "");
  return { name, filename, points, segments: split, hasElevation: sawElevation };
}

function haversine(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const p1 = lat1*Math.PI/180, p2 = lat2*Math.PI/180;
  const dp = (lat2-lat1)*Math.PI/180, dl = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

function rideStats(ride){
  let dist = 0, gain = 0, loss = 0;
  // Per segment, so gaps between segments contribute no distance or climb.
  for(const pts of (ride.segments || [ride.points])){
    for(let i=1;i<pts.length;i++){
      dist += haversine(pts[i-1].lat, pts[i-1].lon, pts[i].lat, pts[i].lon);
      const de = pts[i].ele - pts[i-1].ele;
      if(de>0) gain += de; else loss += -de;
    }
  }
  return { distanceKm: dist/1000, gainM: gain, lossM: loss };
}

/* ---------------- RDP simplification (iterative) ---------------- */
function rdp(points, epsilon){
  if(points.length < 3) return points.slice();
  const keep = new Uint8Array(points.length);
  keep[0]=1; keep[points.length-1]=1;
  const stack = [[0, points.length-1]];
  function perpDist(pt,a,b){
    if(a[0]===b[0] && a[1]===b[1]) return Math.hypot(pt[0]-a[0], pt[1]-a[1]);
    const [x1,y1]=a,[x2,y2]=b;
    const num = Math.abs((y2-y1)*pt[0]-(x2-x1)*pt[1]+x2*y1-y2*x1);
    const den = Math.hypot(y2-y1,x2-x1);
    return num/den;
  }
  while(stack.length){
    const [s,e] = stack.pop();
    if(e-s < 2) continue;
    let dmax=0, idx=s;
    for(let i=s+1;i<e;i++){
      const d = perpDist(points[i], points[s], points[e]);
      if(d>dmax){ dmax=d; idx=i; }
    }
    if(dmax > epsilon){
      keep[idx]=1;
      stack.push([s,idx]);
      stack.push([idx,e]);
    }
  }
  return points.filter((_,i)=>keep[i]);
}

/* ---------------- projection helpers ---------------- */
function makeProjector(rides){
  const allPts = rides.flatMap(r=>r.points);
  const meanLat = allPts.reduce((s,p)=>s+p.lat,0)/allPts.length;
  const cosLat = Math.cos(meanLat*Math.PI/180);

  // A route crossing the antimeridian has longitudes near +180 and -180, so a naive
  // min/max spans ~360 degrees and the whole layout collapses. Detect that and work in
  // a continuous frame where the eastern side keeps going past +180. Longitudes are
  // wrapped back into [-180,180] only where they must be: building tile URLs.
  const lons = allPts.map(p=>p.lon);
  const [rawMin, rawMax] = extent(lons);
  let crosses = false;
  if(rawMax - rawMin > 180){
    // is the route genuinely global, or just straddling the seam?
    const shifted = lons.map(l => l < 0 ? l+360 : l);
    const [sMin, sMax] = extent(shifted);
    if((sMax - sMin) < (rawMax - rawMin)) crosses = true;
  }
  const unwrap = lon => (crosses && lon < 0) ? lon + 360 : lon;

  const project = (lat,lon)=>[unwrap(lon)*cosLat, lat];
  return { project, cosLat, meanLat, unwrap, crossesAntimeridian: crosses };
}

/* Wrap any longitude back into [-180,180). */
function normLon(lon){ return ((lon + 180) % 360 + 360) % 360 - 180; }

/* ---------------- state ---------------- */
let RIDES = [];
let GRID_CACHE = null; // {values, nx, ny, ...} for contours, or {data,width,height,z,...} for DEM tiles
let GRID_MODE = null;  // which aspect/padding GRID_CACHE was built for
let VEC_CACHE = null;  // decoded OpenFreeMap vector tiles (roads, water, places)
let LAST_RENDER = null; // args behind the on-screen poster, so PNG export can re-render it sharper

/* ---------------- UI wiring ---------------- */

async function handleFiles(fileListObj){
  const files = Array.from(fileListObj).filter(f=>f.name.toLowerCase().endsWith('.gpx'));
  if(!files.length) return;
  RIDES = [];
  for(const f of files){
    const text = await f.text();
    try{
      const ride = parseGPX(text, f.name);
      if(ride.points.length < 2) continue;
      ride.startTime = ride.points.find(p=>p.time)?.time || null;
      RIDES.push(ride);
    }catch(err){ console.error('parse fail', f.name, err); }
  }
  RIDES.sort((a,b)=>{
    if(a.startTime && b.startTime) return new Date(a.startTime) - new Date(b.startTime);
    return 0;
  });
  renderFileList();
  buildBtn.disabled = RIDES.length === 0;
  GRID_CACHE = null; GRID_MODE = null;
}

function renderFileList(){
  fileListEl.innerHTML = '';
  const U = makeUnits(document.getElementById('unitSelect')?.value);
  RIDES.forEach((r,i)=>{
    const s = rideStats(r);
    const div = document.createElement('div');
    const dateStr = r.startTime ? new Date(r.startTime).toISOString().slice(0,10) : '?';
    div.innerHTML = `<span>Day ${i+1} — ${r.name} (${dateStr})</span><span>${U.dist(s.distanceKm).toFixed(0)} ${U.distShort.toLowerCase()} · +${Math.round(U.elev(s.gainM)).toLocaleString()} ${U.elevShort.toLowerCase()}</span>`;
    fileListEl.appendChild(div);
  });
}
document.addEventListener('change', e=>{ if(e.target && e.target.id==='unitSelect' && RIDES.length) renderFileList(); });

document.getElementById('buildBtn').addEventListener('click', buildPoster);
document.getElementById('rebuild').addEventListener('click', buildPoster);

async function buildPoster(){
  buildBtn.disabled = true;
  statusEl.className = ''; statusEl.textContent = 'Crunching GPS points…';
  posterPanel.classList.add('hidden');

  const palette = document.getElementById('paletteSelect').value;
  const titleOverride = document.getElementById('titleInput').value.trim();
  const subtitleOverride = document.getElementById('subtitleInput').value.trim();
  const [aspW, aspH] = document.getElementById('aspectSelect').value.split(':').map(Number);
  const aspect = { w: aspW, h: aspH };
  const unitSystem = document.getElementById('unitSelect').value;
  const framePad = parseFloat(document.getElementById('padSelect').value);
  const waterMode = 'auto';   // water is always drawn; it is part of the map, not an option
  const roadMode = document.getElementById('roadSelect').value;
  const elevMode = document.getElementById('elevSelect').value;

  const proj = makeProjector(RIDES);

  // DEM tiles are fetched to cover the map rectangle, so a cached layer built for a
  // different aspect ratio or padding must not be reused.
  const cacheKey = `${aspW}:${aspH}|${framePad}|${elevMode}`;
  if(GRID_MODE !== cacheKey){ GRID_CACHE = null; VEC_CACHE = null; GRID_MODE = cacheKey; }

  if(!(GRID_CACHE && GRID_CACHE.isTerrain)){
    let seconds = 0;
    const ticker = setInterval(()=>{ seconds++; }, 1000);
    statusEl.className = '';
    statusEl.textContent = 'Fetching terrain tiles… (0s elapsed)';

    const WATCHDOG_MS = 25000;
    const watchdog = new Promise((_,rej)=>setTimeout(()=>rej(Object.assign(new Error('watchdog'),{name:'WatchdogError'})), WATCHDOG_MS));

    try{
      const tiles = await Promise.race([
        fetchTerrainTiles(RIDES, mapRectBounds(RIDES, proj, aspect, 0.03, framePad, elevMode), (d,t)=>{
          statusEl.textContent = `Fetching terrain tiles… ${d}/${t} tiles (${seconds}s elapsed)`;
        }),
        watchdog
      ]);
      GRID_CACHE = tiles;
      clearInterval(ticker);
      statusEl.className = 'live';
      statusEl.textContent = `Hillshade from real DEM (zoom ${tiles.z}, Mapzen/AWS Open Data).`;
    }catch(err){
      clearInterval(ticker);
      console.warn('terrain tile fetch failed', err);
      GRID_CACHE = null;   // no terrain rather than a poor substitute
      statusEl.className = 'fallback';
      let reason = 'network error';
      if(err && err.name === 'AbortError') reason = 'tile request timed out';
      if(err && err.name === 'WatchdogError') reason = 'no response after 25s';
      if(err && err.name === 'TaintError') reason = 'browser blocked reading the tiles (CORS)';
      statusEl.textContent = `Terrain unavailable (${reason}) — the poster is rendered without it. Tip: opening this over a local server (run "python3 -m http.server" in this folder, then visit http://localhost:8000) usually fixes tile access.`;
    }
  } else {
    statusEl.className = 'live';
    statusEl.textContent = 'Hillshade from real DEM (cached from last fetch).';
  }

  // Vector tiles: roads, place labels, and authoritative water polygons.
  // Water polygons live in the same vector tiles as roads, so these are always fetched —
  // hiding roads must not throw away the authoritative water data, or lakes vanish and DEM
  // seam artefacts reappear offshore.
  if(!VEC_CACHE){
    const prevStatus = statusEl.textContent, prevClass = statusEl.className;
    statusEl.className = '';
    statusEl.textContent = 'Fetching map data (roads, water)…';
    const watchdog2 = new Promise((_,rej)=>setTimeout(()=>rej(Object.assign(new Error('watchdog'),{name:'WatchdogError'})), 25000));
    try{
      VEC_CACHE = await Promise.race([
        fetchVectorTiles(mapRectBounds(RIDES, proj, aspect, 0.03, framePad, elevMode), (d,t)=>{
          statusEl.textContent = `Fetching map data… ${d}/${t} tiles`;
        }),
        watchdog2
      ]);
      statusEl.className = prevClass;
      statusEl.textContent = prevStatus + ' Roads and water from OpenStreetMap.';
    }catch(err){
      console.warn('vector tile fetch failed', err);
      VEC_CACHE = null;
      statusEl.className = 'fallback';
      statusEl.textContent = prevStatus + ' Roads unavailable (' +
        (err && err.name === 'WatchdogError' ? 'no response after 25s' : 'network error') +
        ') — poster rendered without them.';
    }
  }
  const vecForRender = VEC_CACHE;

  LAST_RENDER = { rides: RIDES, proj, grid: GRID_CACHE, palette, titleOverride, subtitleOverride,
                  aspect, unitSystem, framePad, waterMode, vec: vecForRender, elevMode, roadMode };
  const svg = renderPosterSVG(RIDES, proj, GRID_CACHE, palette, titleOverride, subtitleOverride, aspect, unitSystem, framePad, waterMode, vecForRender, elevMode, roadMode);
  posterWrap.innerHTML = svg;
  posterPanel.classList.remove('hidden');
  buildBtn.disabled = false;
  posterPanel.scrollIntoView({behavior:'smooth', block:'start'});
}

/* ---------------- palette definitions ---------------- */
const DAY_INK = '#20211f';

/* ColorBrewer Spectral, inlined rather than pulling in all of d3-scale-chromatic.
   Days are spread across the middle of the ramp so the run reads as a gradient from
   one end of the trip to the other. */
const SPECTRAL = ['#9e0142','#d53e4f','#f46d43','#fdae61','#fee08b','#ffffbf',
                  '#e6f598','#abdda4','#66c2a5','#3288bd','#5e4fa2'];
function spectral(t){
  t = t<0?0:(t>1?1:t);
  const x = t*(SPECTRAL.length-1);
  const i = Math.min(SPECTRAL.length-2, Math.floor(x));
  const f = x-i;
  const hex = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  const a = hex(SPECTRAL[i]), b = hex(SPECTRAL[i+1]);
  const c = a.map((v,k)=> Math.round(v + (b[k]-v)*f));
  return '#' + c.map(v=>v.toString(16).padStart(2,'0')).join('');
}

function getPalette(name){
  const base = { paper:'#f4efe4', ink:DAY_INK, mute:'#8c8577', contour:DAY_INK };
  if(name === 'days') return { ...base,
    // a single day has no progression to show, so it stays plain ink
    dayColor:(i,n)=> (n > 1) ? spectral(0.15 + 0.7*(i/Math.max(n-1,1))) : DAY_INK };
  return { ...base, dayColor:()=> DAY_INK };
}

/* ---------------- small helpers ---------------- */
// Loop-based extent: Math.min(...arr) can blow the call stack on 100k+ point arrays.
function extent(arr){
  let mn = Infinity, mx = -Infinity;
  for(let i=0;i<arr.length;i++){ const v = arr[i]; if(v<mn) mn=v; if(v>mx) mx=v; }
  return [mn,mx];
}

/* ---------------- Mapbox Vector Tile decoding ----------------
   A compact MVT reader built on the vendored pbf. @mapbox/vector-tile is ESM-only
   with no UMD build, and the format is small enough to read directly:
     Tile   { layers = 3 }
     Layer  { name = 1, features = 2, keys = 3, values = 4, extent = 5, version = 15 }
     Feature{ id = 1, tags = 2 (packed), type = 3, geometry = 4 (packed) }
     Value  { string=1, float=2, double=3, int64=4, uint64=5, sint64=6, bool=7 }
   Geometry is a command stream: cmd = (id & 0x7) | (count << 3), with
   MoveTo=1, LineTo=2, ClosePath=7 and zigzag-encoded deltas.                       */

function mvtDecodeTile(buf){
  const layers = {};
  new Pbf.PbfReader(buf).readFields((tag, _o, pbf) => {
    if(tag === 3){
      const layer = mvtReadLayer(pbf, pbf.readVarint() + pbf.pos);
      if(layer && layer.name) layers[layer.name] = layer;
    }
  }, layers);
  return layers;
}

function mvtReadLayer(pbf, end){
  const layer = { name:'', extent:4096, keys:[], values:[], featureOffsets:[] };
  while(pbf.pos < end){
    const val = pbf.readVarint(), tag = val >> 3;
    if(tag === 1) layer.name = pbf.readString();
    else if(tag === 2){ layer.featureOffsets.push(pbf.pos); pbf.skip(val); }
    else if(tag === 3) layer.keys.push(pbf.readString());
    else if(tag === 4) layer.values.push(mvtReadValue(pbf, pbf.readVarint() + pbf.pos));
    else if(tag === 5) layer.extent = pbf.readVarint();
    else pbf.skip(val);
  }
  layer._pbf = pbf;
  return layer;
}

function mvtReadValue(pbf, end){
  let value = null;
  while(pbf.pos < end){
    const val = pbf.readVarint(), tag = val >> 3;
    if(tag === 1) value = pbf.readString();
    else if(tag === 2) value = pbf.readFloat();
    else if(tag === 3) value = pbf.readDouble();
    else if(tag === 4) value = pbf.readVarint(true);
    else if(tag === 5) value = pbf.readVarint();
    else if(tag === 6) value = pbf.readSVarint();
    else if(tag === 7) value = pbf.readBoolean();
    else pbf.skip(val);
  }
  return value;
}

/* Iterate a layer's features. cb({type, props, rings}) where rings are arrays of
   [x,y] in tile-local units (0..extent). type: 1=point, 2=line, 3=polygon. */
function mvtEachFeature(layer, cb){
  const pbf = layer._pbf;
  for(const off of layer.featureOffsets){
    pbf.pos = off;
    const end = pbf.readVarint() + pbf.pos;
    let type = 0, tags = null, geomStart = -1, geomEnd = -1;
    while(pbf.pos < end){
      const val = pbf.readVarint(), tag = val >> 3;
      if(tag === 1) pbf.readVarint();                    // id
      else if(tag === 2) tags = pbf.readPackedVarint();
      else if(tag === 3) type = pbf.readVarint();
      else if(tag === 4){ const len = pbf.readVarint(); geomStart = pbf.pos; geomEnd = pbf.pos + len; pbf.pos = geomEnd; }
      else pbf.skip(val);
    }
    const props = {};
    if(tags){
      for(let i=0;i<tags.length;i+=2){
        const k = layer.keys[tags[i]], v = layer.values[tags[i+1]];
        if(k !== undefined) props[k] = v;
      }
    }
    let rings = [];
    if(geomStart >= 0){
      pbf.pos = geomStart;
      rings = mvtReadGeometry(pbf, geomEnd);
    }
    cb({ type, props, rings });
  }
}

function mvtReadGeometry(pbf, end){
  const rings = [];
  let cur = null, x = 0, y = 0;
  while(pbf.pos < end){
    const cmdInt = pbf.readVarint();
    const cmd = cmdInt & 0x7, count = cmdInt >> 3;
    if(cmd === 1){                       // MoveTo — starts a new ring/part
      for(let i=0;i<count;i++){
        x += pbf.readSVarint(); y += pbf.readSVarint();
        if(cur && cur.length) rings.push(cur);
        cur = [[x,y]];
      }
    } else if(cmd === 2){                // LineTo
      for(let i=0;i<count;i++){
        x += pbf.readSVarint(); y += pbf.readSVarint();
        if(cur) cur.push([x,y]);
      }
    } else if(cmd === 7){                // ClosePath
      if(cur && cur.length) cur.push([cur[0][0], cur[0][1]]);
    }
  }
  if(cur && cur.length) rings.push(cur);
  return rings;
}

/* ---------------- OpenFreeMap vector tiles (roads, water, places) ----------------
   Public instance: no API key, no request limits. The tile URL embeds a dated build
   that rotates weekly, so it MUST be resolved from the TileJSON at runtime rather
   than hardcoded. Data (c) OpenStreetMap contributors, via OpenMapTiles.          */
function fetchWithTimeout(url, ms){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), ms || 10000);
  return fetch(url, {signal: controller.signal}).finally(()=>clearTimeout(timer));
}

const OFM_TILEJSON = 'https://tiles.openfreemap.org/planet';
let OFM_TEMPLATE = null;

async function ofmTileTemplate(){
  if(OFM_TEMPLATE) return OFM_TEMPLATE;
  const resp = await fetchWithTimeout(OFM_TILEJSON, 8000);
  if(!resp.ok) throw new Error('tilejson status ' + resp.status);
  const tj = await resp.json();
  if(!tj.tiles || !tj.tiles.length) throw new Error('tilejson has no tiles');
  OFM_TEMPLATE = tj.tiles[0];
  return OFM_TEMPLATE;
}

/* Which road classes to draw, given how much ground the poster covers. A 1 km run can
   afford residential streets; a 600 km tour would be a hairball, so it gets trunk roads
   and motorways only. */
function roadClassesForSpan(spanKm){
  if(spanKm <= 8)   return ['motorway','trunk','primary','secondary','tertiary','minor','service','track','path'];
  if(spanKm <= 25)  return ['motorway','trunk','primary','secondary','tertiary','minor','track'];
  if(spanKm <= 70)  return ['motorway','trunk','primary','secondary','tertiary'];
  if(spanKm <= 200) return ['motorway','trunk','primary','secondary'];
  if(spanKm <= 500) return ['motorway','trunk','primary'];
  return ['motorway','trunk'];
}
function placeClassesForSpan(spanKm){
  if(spanKm <= 25)  return ['city','town','village'];
  if(spanKm <= 150) return ['city','town'];
  return ['city'];
}
/* Relative weight per class, so motorways read heavier than lanes. */
const ROAD_WEIGHT = { motorway:0.90, trunk:0.82, primary:0.70, secondary:0.57,
                      tertiary:0.48, minor:0.37, service:0.30, track:0.30, path:0.25 };

/* Vector tiles are served to z14; pick the highest zoom that fits the tile budget. */
async function fetchVectorTiles(bounds, onProgress){
  const template = await ofmTileTemplate();
  const BUDGET = 24;
  let chosen = null;
  for(let z=14; z>=2; z--){
    const x0=Math.floor(lonToTileX(bounds.minLon,z)), x1=Math.floor(lonToTileX(bounds.maxLon,z));
    const y0=Math.floor(latToTileY(bounds.maxLat,z)), y1=Math.floor(latToTileY(bounds.minLat,z));
    const count=(x1-x0+1)*(y1-y0+1);
    if(count<=BUDGET){ chosen={z,x0,x1,y0,y1,count}; break; }
  }
  if(!chosen) throw new Error('could not fit vector tiles in budget');

  const {z,x0,x1,y0,y1} = chosen;
  const jobs = [];
  let done = 0;
  const total = (x1-x0+1)*(y1-y0+1);
  for(let ty=y0; ty<=y1; ty++){
    for(let tx=x0; tx<=x1; tx++){
      const url = template.replace('{z}',z).replace('{x}',wrapTileX(tx,z)).replace('{y}',ty);
      jobs.push((async ()=>{
        const r = await fetchWithTimeout(url, 12000);
        // 204/404 simply mean an empty tile (ocean, wilderness) — not an error
        if(r.status === 204 || r.status === 404){ done++; if(onProgress) onProgress(done,total); return null; }
        if(!r.ok) throw new Error('tile status ' + r.status);
        const buf = new Uint8Array(await r.arrayBuffer());
        done++; if(onProgress) onProgress(done,total);
        return { tx, ty, z, layers: mvtDecodeTile(buf) };
      })());
    }
  }
  const tiles = (await Promise.all(jobs)).filter(Boolean);
  return { z, tiles, live:true, isVector:true };
}

/* Convert a feature's tile-local coords to lon/lat. */
function mvtToLonLat(tx, ty, z, extent, px, py){
  const n = Math.pow(2,z);
  const lon = ((tx + px/extent) / n) * 360 - 180;
  const ny = Math.PI * (1 - 2*(ty + py/extent)/n);
  const lat = Math.atan(Math.sinh(ny)) * 180/Math.PI;
  return [lon, lat];
}

/* Pull the layers we care about out of the fetched tiles, in lon/lat. */
function extractVectorFeatures(vec, roadClasses, placeClasses){
  const roads = [];   // {cls, pts:[[lon,lat],...]}
  const water = [];   // rings of [[lon,lat],...]
  const places = [];  // {cls, name, rank, lon, lat}
  if(!vec || !vec.tiles) return { roads, water, places };

  for(const t of vec.tiles){
    const { tx, ty, z, layers } = t;

    const wl = layers.water;
    if(wl){
      mvtEachFeature(wl, f => {
        if(f.type !== 3) return;
        for(const ring of f.rings){
          if(ring.length < 3) continue;
          water.push(ring.map(([px,py])=>mvtToLonLat(tx,ty,z,wl.extent,px,py)));
        }
      });
    }

    const tl = layers.transportation;
    if(tl && roadClasses.length){
      const want = new Set(roadClasses);
      mvtEachFeature(tl, f => {
        if(f.type !== 2) return;                       // lines only
        const cls = f.props.class;
        if(!want.has(cls)) return;
        if(f.props.brunnel === 'tunnel') return;       // don't draw what you can't see
        for(const part of f.rings){
          if(part.length < 2) continue;
          roads.push({ cls, pts: part.map(([px,py])=>mvtToLonLat(tx,ty,z,tl.extent,px,py)) });
        }
      });
    }

    const pl = layers.place;
    if(pl && placeClasses.length){
      const want = new Set(placeClasses);
      mvtEachFeature(pl, f => {
        if(f.type !== 1) return;
        const cls = f.props.class;
        if(!want.has(cls)) return;
        const pt = f.rings[0] && f.rings[0][0];
        if(!pt) return;
        const [lon,lat] = mvtToLonLat(tx,ty,z,pl.extent,pt[0],pt[1]);
        places.push({ cls, name: f.props['name:latin'] || f.props.name || '', rank: f.props.rank ?? 99, lon, lat });
      });
    }
  }
  return { roads, water, places };
}

/* ---------------- terrain tiles (AWS Open Data, Terrarium encoding) ---------------- */
/* Public S3 open-data bucket: no API key, no logo requirement, print-friendly.
   Terrarium encoding: elevation_m = (R*256 + G + B/256) - 32768 */
const TILE_URL = (z,x,y)=>`https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${x}/${y}.png`;
const TILE_SIZE = 256;
const TILE_BUDGET = 36;

function lonToTileX(lon,z){ return (lon+180)/360 * Math.pow(2,z); }
/* Tile column index wrapped onto the globe, for URLs when a route crosses the seam. */
function wrapTileX(tx, z){ const n = Math.pow(2,z); return ((tx % n) + n) % n; }
function latToTileY(lat,z){
  const r = lat*Math.PI/180;
  return (1 - Math.log(Math.tan(r) + 1/Math.cos(r))/Math.PI)/2 * Math.pow(2,z);
}

function loadImage(url, timeoutMs){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const timer = setTimeout(()=>{ img.src=''; reject(Object.assign(new Error('tile timeout'),{name:'AbortError'})); }, timeoutMs||10000);
    img.crossOrigin = 'anonymous';
    img.onload = ()=>{ clearTimeout(timer); resolve(img); };
    img.onerror = ()=>{ clearTimeout(timer); reject(new Error('tile load failed')); };
    img.src = url;
  });
}

function routeBounds(rides, padFrac){
  const allPts = rides.flatMap(r=>r.points);
  const [minLat,maxLat] = extent(allPts.map(p=>p.lat));
  const [minLon,maxLon] = extent(allPts.map(p=>p.lon));
  const pf = padFrac ?? 0.12;
  const pLat = (maxLat-minLat)*pf || 0.02;
  const pLon = (maxLon-minLon)*pf || 0.02;
  return { minLat:minLat-pLat, maxLat:maxLat+pLat, minLon:minLon-pLon, maxLon:maxLon+pLon };
}

async function fetchTerrainTiles(rides, bounds, onProgress){
  const b = bounds;

  // pick the highest zoom whose tile count fits the budget
  let chosen = null;
  for(let z=12; z>=5; z--){
    const x0=Math.floor(lonToTileX(b.minLon,z)), x1=Math.floor(lonToTileX(b.maxLon,z));
    const y0=Math.floor(latToTileY(b.maxLat,z)), y1=Math.floor(latToTileY(b.minLat,z));
    const count=(x1-x0+1)*(y1-y0+1);
    if(count<=TILE_BUDGET){ chosen={z,x0,x1,y0,y1,count}; break; }
  }
  if(!chosen) throw new Error('could not fit tiles in budget');

  const {z,x0,x1,y0,y1} = chosen;
  const cols = x1-x0+1, rows = y1-y0+1;
  const canvas = document.createElement('canvas');
  canvas.width = cols*TILE_SIZE; canvas.height = rows*TILE_SIZE;
  const ctx = canvas.getContext('2d', {willReadFrequently:true});

  const jobs = [];
  let done = 0;
  for(let ty=y0; ty<=y1; ty++){
    for(let tx=x0; tx<=x1; tx++){
      jobs.push((async ()=>{
        const img = await loadImage(TILE_URL(z,wrapTileX(tx,z),ty), 10000);
        ctx.drawImage(img, (tx-x0)*TILE_SIZE, (ty-y0)*TILE_SIZE);
        done++;
        if(onProgress) onProgress(done, cols*rows);
      })());
    }
  }
  await Promise.all(jobs);

  // Reading pixels throws a SecurityError if the bucket didn't send CORS headers.
  let imgData;
  try{
    imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
  }catch(e){
    throw Object.assign(new Error('tile canvas is CORS-tainted'), {name:'TaintError'});
  }

  return {
    data: imgData.data, width: canvas.width, height: canvas.height,
    z, x0, y0, live:true, isTerrain:true
  };
}

/* Decode terrarium elevation. Bilinear by default — nearest-neighbour sampling of a DEM
   that is finer than the output raster produces stair-stepped ridges and moire. */
function decodeElevAt(t, px, py){
  const i = (py*t.width + px)*4;
  return (t.data[i]*256 + t.data[i+1] + t.data[i+2]/256) - 32768;
}

function sampleTerrainElev(t, lat, lon, nearest){
  const gx = lonToTileX(lon, t.z)*TILE_SIZE - t.x0*TILE_SIZE;
  const gy = latToTileY(lat, t.z)*TILE_SIZE - t.y0*TILE_SIZE;
  if(gx < 0 || gy < 0 || gx > t.width-1 || gy > t.height-1) return null;

  if(nearest){
    return decodeElevAt(t, Math.round(gx), Math.round(gy));
  }
  const x0 = Math.floor(gx), y0 = Math.floor(gy);
  const x1 = Math.min(x0+1, t.width-1), y1 = Math.min(y0+1, t.height-1);
  const fx = gx-x0, fy = gy-y0;
  const e00 = decodeElevAt(t,x0,y0), e10 = decodeElevAt(t,x1,y0);
  const e01 = decodeElevAt(t,x0,y1), e11 = decodeElevAt(t,x1,y1);
  return (e00*(1-fx) + e10*fx)*(1-fy) + (e01*(1-fx) + e11*fx)*fy;
}

/* Ground resolution of the DEM itself, metres per source pixel. */
function demMetresPerPixel(t, lat){
  return (40075016.686 * Math.cos(lat*Math.PI/180) / Math.pow(2, t.z)) / TILE_SIZE;
}

/* Rasterize polygon rings (in SVG coords) into a 0/1 mask over the map rect.
   Uses the NONZERO winding rule, which is what MVT polygons are defined with:
   holes are rings wound opposite to their exterior. Even-odd would be wrong twice
   over — vector tiles are clipped per tile with a buffer, so neighbouring tiles'
   water polygons overlap, and under even-odd every overlap cancels itself back to
   land, punching tile-shaped holes in the sea. */
function rasterizePolygons(rings, rectX, rectY, rectW, rectH, OW, OH){
  const mask = new Uint8Array(OW*OH);
  const polys = rings.map(r => r.map(([x,y]) => [ (x-rectX)/rectW*OW, (y-rectY)/rectH*OH ]));

  // bucket edges by scanline so we don't test every edge against every row
  const edges = [];
  let gMinY = Infinity, gMaxY = -Infinity;
  for(const poly of polys){
    for(let i=0, n=poly.length; i<n; i++){
      const a = poly[i], b = poly[(i+1)%n];
      if(a[1] === b[1]) continue;                   // horizontal edges never cross a scanline
      edges.push(a[1] < b[1] ? {x0:a[0],y0:a[1],x1:b[0],y1:b[1],dir:1}
                             : {x0:b[0],y0:b[1],x1:a[0],y1:a[1],dir:-1});
      if(Math.min(a[1],b[1]) < gMinY) gMinY = Math.min(a[1],b[1]);
      if(Math.max(a[1],b[1]) > gMaxY) gMaxY = Math.max(a[1],b[1]);
    }
  }
  if(!edges.length) return mask;

  const yStart = Math.max(0, Math.floor(gMinY));
  const yEnd   = Math.min(OH-1, Math.ceil(gMaxY));
  const buckets = new Array(OH);
  for(const e of edges){
    const s = Math.max(yStart, Math.floor(e.y0));
    const t = Math.min(yEnd, Math.ceil(e.y1));
    for(let y=s; y<=t; y++){ (buckets[y] || (buckets[y] = [])).push(e); }
  }

  const xs = [];
  for(let py=yStart; py<=yEnd; py++){
    const bucket = buckets[py];
    if(!bucket) continue;
    const yc = py + 0.5;
    xs.length = 0;
    for(const e of bucket){
      if(yc < e.y0 || yc >= e.y1) continue;
      const t = (yc - e.y0)/(e.y1 - e.y0);
      xs.push([ e.x0 + t*(e.x1 - e.x0), e.dir ]);
    }
    if(xs.length < 2) continue;
    xs.sort((p,q)=>p[0]-q[0]);
    let winding = 0;
    for(let i=0;i<xs.length-1;i++){
      winding += xs[i][1];
      if(winding === 0) continue;                   // outside under nonzero
      let x0 = Math.ceil(xs[i][0]-0.5), x1 = Math.floor(xs[i+1][0]-0.5);
      if(x1 < 0 || x0 >= OW) continue;
      if(x0 < 0) x0 = 0;
      if(x1 >= OW) x1 = OW-1;
      const row = py*OW;
      for(let x=x0; x<=x1; x++) mask[row+x] = 1;
    }
  }
  return mask;
}

/* Resample terrain into poster space and render a grayscale hillshade PNG data URI.
   invProject(sx,sy) -> [lat,lon] so the raster aligns exactly with the drawn route. */
function buildHillshadeDataURI(t, invProject, rectX, rectY, rectW, rectH, opts){
  const o = opts || {};
  // Default caps the raster at 1500 px and never above 1:1 with SVG units. A large PNG
  // export raises this so the terrain is generated at output resolution rather than being
  // upscaled next to crisp vector text.
  const maxDim = o.maxDim ?? Math.min(1500, Math.max(rectW, rectH));
  const sc = maxDim/Math.max(rectW, rectH);
  const OW = Math.max(2, Math.round(rectW*sc)), OH = Math.max(2, Math.round(rectH*sc));

  const spanMetres = o.spanMetres ?? 60000;
  const outMPerPx = spanMetres/OW;
  const [midLat] = invProject(rectX+rectW/2, rectY+rectH/2);
  const demMPerPx = demMetresPerPixel(t, midLat);
  // When the DEM is finer than the output raster we are downsampling: average a few
  // sub-samples per output pixel instead of point-sampling, or we get aliasing.
  const ratio = outMPerPx/Math.max(demMPerPx, 1e-6);
  const SS = Math.max(1, Math.min(3, Math.ceil(ratio)));

  // 1) elevation grid in poster space. NaN marks "outside tile coverage" so it can be
  //    rendered transparent rather than mistaken for sea level.
  //    waterFrac tracks how many sub-samples were at/below sea level — voting beats
  //    averaging at a coastline, where a mixed pixel's mean lands arbitrarily.
  const elevRaw = new Float32Array(OW*OH);
  const waterFrac = new Float32Array(OW*OH);
  // Sea level is NOT a constant. In the Netherlands (and other polder/depression regions)
  // dry land sits several metres below sea level, so a fixed 0.5 m threshold paints the
  // whole country as ocean. The caller derives this from the route's own elevations —
  // the track is standing proof of where land is.
  const SEA = o.seaLevel ?? 0.5;
  const waterOff = o.waterMode === 'off';
  let anyLand = false;
  for(let oy=0; oy<OH; oy++){
    for(let ox=0; ox<OW; ox++){
      let sum = 0, n = 0, wv = 0;
      for(let sy2=0; sy2<SS; sy2++){
        for(let sx2=0; sx2<SS; sx2++){
          const sx = rectX + (ox + (sx2+0.5)/SS)/OW*rectW;
          const sy = rectY + (oy + (sy2+0.5)/SS)/OH*rectH;
          const [lat,lon] = invProject(sx,sy);
          const e = sampleTerrainElev(t, lat, lon);
          if(e!==null){ sum += e; n++; if(e <= SEA) wv++; }
        }
      }
      const i = oy*OW+ox;
      elevRaw[i]  = n===0 ? NaN : sum/n;
      waterFrac[i]= n===0 ? 0    : wv/n;
      if(n>0 && elevRaw[i] > SEA) anyLand = true;
    }
  }
  if(!anyLand) throw new Error('terrain sample produced no land');

  // 2) water mask, then clamp the sea flat. Bathymetry is real data but it turns the
  //    shoreline into a cliff and paints a hard black rim on the coast.
  const isWater = new Uint8Array(OW*OH);
  const elevC = new Float32Array(OW*OH);
  for(let i=0;i<OW*OH;i++){
    const v = elevRaw[i];
    if(Number.isNaN(v)){ elevC[i] = NaN; continue; }
    isWater[i] = (!waterOff && waterFrac[i] >= 0.5) ? 1 : 0;
    elevC[i] = v < SEA ? SEA : v;   // the water surface is flat at sea level
  }

  // If OSM water polygons are available they are authoritative: they say what is actually
  // sea or lake, independent of elevation. That settles both below-sea-level land (polders
  // read as land) and DEM seam artefacts offshore (rectangular patches read as water).
  const wpolys = o.waterPolysSvg;
  const haveWaterPolys = !waterOff && Array.isArray(wpolys) && wpolys.length > 0;
  if(haveWaterPolys){
    const mask = rasterizePolygons(wpolys, rectX, rectY, rectW, rectH, OW, OH);
    for(let i=0;i<OW*OH;i++){
      if(Number.isNaN(elevC[i])) continue;
      isWater[i] = mask[i];
    }
  }

  // 2a) The DEM fills voids over water with small positive values, which an absolute
  //     height test reads as land — flat, unshaded, and visible as pale blotches offshore.
  //     Real sea is dead flat, so flood-fill outward from known water through connected
  //     flat, near-sea-level ground. A flood fill (rather than a few dilation passes)
  //     absorbs blotches of any size; requiring connectivity keeps inland flats as land.
  const NEAR_SEA = o.nearSeaLevel ?? (SEA + 7.5);   // metres, relative to actual sea level
  const FLAT_RELIEF = o.flatRelief ?? 3;   // metres of relief across a 3x3 neighbourhood

  const relief = new Float32Array(OW*OH);
  for(let y=0;y<OH;y++){
    for(let x=0;x<OW;x++){
      let mn=Infinity, mx=-Infinity;
      for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
        const xx=x+dx, yy=y+dy;
        if(xx<0||yy<0||xx>=OW||yy>=OH) continue;
        const v = elevC[yy*OW+xx];
        if(Number.isNaN(v)) continue;
        if(v<mn) mn=v; if(v>mx) mx=v;
      }
      relief[y*OW+x] = (mx===-Infinity) ? Infinity : mx-mn;
    }
  }

  const queue = new Int32Array(OW*OH);
  let qHead = 0, qTail = 0;
  // Remember which pixels were water on elevation evidence alone. Those are real water and
  // must never be handed back to land — only flood-fill *additions* are reconsidered below.
  const seedWater = new Uint8Array(OW*OH);
  if(!waterOff && !haveWaterPolys){
    for(let i=0;i<OW*OH;i++) if(isWater[i]){ seedWater[i]=1; queue[qTail++] = i; }
  }
  while(qHead < qTail){
    const i = queue[qHead++];
    const x = i % OW, y = (i - x)/OW;
    for(let dy=-1;dy<=1;dy++){
      for(let dx=-1;dx<=1;dx++){
        if(dx===0 && dy===0) continue;
        const xx=x+dx, yy=y+dy;
        if(xx<0||yy<0||xx>=OW||yy>=OH) continue;
        const j = yy*OW+xx;
        if(isWater[j] || Number.isNaN(elevC[j])) continue;
        if(elevC[j] > NEAR_SEA || relief[j] > FLAT_RELIEF) continue;
        isWater[j] = 1;
        queue[qTail++] = j;
      }
    }
  }

  // 2c) Flat land adjacent to the sea (Dutch polders, reclaimed land) is genuinely below
  //     sea level and connected to the ocean, so the flood fill above will happily swallow
  //     an entire country. The decisive evidence is the GPX track: the rider was on land.
  //     Label connected water regions and hand back any region the route substantially
  //     runs through. A short ferry crossing stays water; a whole ride through polders
  //     does not.
  const routePx = o.routePixels || [];
  if(routePx.length && !waterOff && !haveWaterPolys){
    const routeIdx = [];
    for(const [sx,sy] of routePx){
      const ox = Math.floor((sx-rectX)/rectW*OW);
      const oy = Math.floor((sy-rectY)/rectH*OH);
      if(ox<0||oy<0||ox>=OW||oy>=OH) continue;
      routeIdx.push(oy*OW+ox);
    }
    if(routeIdx.length){
      const label = new Int32Array(OW*OH).fill(-1);
      const compRouteHits = [];
      const compCells = [];
      let nComp = 0;
      const stack = new Int32Array(OW*OH);
      const isAdded = i => isWater[i] && !seedWater[i];
      for(let start=0; start<OW*OH; start++){
        if(!isAdded(start) || label[start] !== -1) continue;
        const id = nComp++;
        let sp = 0, cells = 0;
        stack[sp++] = start; label[start] = id;
        while(sp>0){
          const i = stack[--sp];
          cells++;
          const x = i % OW, y = (i-x)/OW;
          for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
            if(dx===0&&dy===0) continue;
            const xx=x+dx, yy=y+dy;
            if(xx<0||yy<0||xx>=OW||yy>=OH) continue;
            const j = yy*OW+xx;
            if(isAdded(j) && label[j]===-1){ label[j]=id; stack[sp++]=j; }
          }
        }
        compRouteHits[id] = 0;
        compCells[id] = cells;
      }
      for(const ri of routeIdx){
        const id = label[ri];
        if(id >= 0) compRouteHits[id]++;
      }
      const MIN_FRAC = o.routeLandFrac ?? 0.10;
      for(let id=0; id<nComp; id++){
        if(compRouteHits[id] / routeIdx.length >= MIN_FRAC){
          for(let i=0;i<OW*OH;i++) if(label[i]===id) isWater[i] = 0;
        }
      }
    }
  }

  // 2d) speckle removal: flip pixels that disagree with almost all their neighbours
  for(let pass=0; pass<(haveWaterPolys?0:2); pass++){
    const flips = [];
    for(let y=0;y<OH;y++){
      for(let x=0;x<OW;x++){
        const i=y*OW+x;
        if(Number.isNaN(elevC[i])) continue;
        let w=0, tot=0;
        for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
          if(dx===0&&dy===0) continue;
          const xx=x+dx, yy=y+dy;
          if(xx<0||yy<0||xx>=OW||yy>=OH) continue;
          tot++; if(isWater[yy*OW+xx]) w++;
        }
        if(!tot) continue;
        if(isWater[i] && w <= tot*0.25) flips.push([i,0]);
        else if(!isWater[i] && w >= tot*0.875) flips.push([i,1]);
      }
    }
    if(!flips.length) break;
    for(const [i,v] of flips) isWater[i]=v;
  }

  // 3) light 3x3 smoothing to take the edge off resampling noise without losing ridges
  const elev = new Float32Array(OW*OH);
  for(let y=0;y<OH;y++){
    for(let x=0;x<OW;x++){
      const c = elevC[y*OW+x];
      if(Number.isNaN(c)){ elev[y*OW+x] = NaN; continue; }
      let sum=0, n=0;
      for(let dy=-1;dy<=1;dy++){
        for(let dx=-1;dx<=1;dx++){
          const xx=x+dx, yy=y+dy;
          if(xx<0||yy<0||xx>=OW||yy>=OH) continue;
          const v = elevC[yy*OW+xx];
          if(Number.isNaN(v)) continue;
          const w = (dx===0&&dy===0) ? 4 : 1;
          sum += v*w; n += w;
        }
      }
      elev[y*OW+x] = n? sum/n : c;
    }
  }

  // 2) hillshade (standard slope/aspect illumination)
  // Azimuth is given as a compass bearing (clockwise from north). The illumination formula
  // below works in math convention (counter-clockwise from east), so it must be converted:
  // math = (360 - compass + 90) mod 360. Skipping this conversion lights the terrain from
  // the opposite quadrant and inverts the relief — hills read as valleys.
  const azimuthDeg = o.azimuth ?? 315;                       // 315 = NW, the cartographic default
  const azimuth = (((360 - azimuthDeg + 90) % 360 + 360) % 360) * Math.PI/180;
  const zenith  = (90 - (o.altitude ?? 45)) * Math.PI/180;
  const zFactor = o.zFactor ?? 1.0;
  // metres per output pixel — spanMetres measures the rect's width, so scale by OW
  const metresPerPx = Math.max(1, (o.spanMetres ?? 60000)/OW);

  const out = document.createElement('canvas');
  out.width = OW; out.height = OH;
  const octx = out.getContext('2d');
  const img = octx.createImageData(OW, OH);

  const shadowRGB = o.shadowRGB || [32,33,31];
  const waterRGB  = o.waterRGB  || [32,33,31];
  const strength  = o.strength ?? 0.62;
  const highlight = o.highlight ?? 0.35;
  const waterAlpha= o.waterAlpha ?? 0.10;
  const illFlat   = Math.cos(zenith); // illumination of perfectly flat ground

  const at = (x,y)=>{
    const cx = x<0?0:(x>=OW?OW-1:x);
    const cy = y<0?0:(y>=OH?OH-1:y);
    const v = elev[cy*OW+cx];
    return Number.isNaN(v) ? 0 : v;
  };

  for(let y=0; y<OH; y++){
    for(let x=0; x<OW; x++){
      const idx = (y*OW+x)*4;
      const e = elev[y*OW+x];

      if(Number.isNaN(e)){ // outside tile coverage: leave the paper untouched
        img.data[idx+3] = 0;
        continue;
      }

      if(isWater[y*OW+x]){ // water: flat light tint, gives the coastline for free
        img.data[idx]   = waterRGB[0];
        img.data[idx+1] = waterRGB[1];
        img.data[idx+2] = waterRGB[2];
        img.data[idx+3] = Math.round(255*waterAlpha);
        continue;
      }

      // Horn's method
      const a=at(x-1,y-1), b=at(x,y-1), c=at(x+1,y-1);
      const d=at(x-1,y),               f=at(x+1,y);
      const g=at(x-1,y+1), h=at(x,y+1), i=at(x+1,y+1);
      const dzdx = ((c+2*f+i)-(a+2*d+g))/(8*metresPerPx)*zFactor;
      const dzdy = ((g+2*h+i)-(a+2*b+c))/(8*metresPerPx)*zFactor;
      const slope = Math.atan(Math.sqrt(dzdx*dzdx + dzdy*dzdy));
      let aspect = Math.atan2(dzdy, -dzdx);
      if(aspect<0) aspect += 2*Math.PI;

      let ill = Math.cos(zenith)*Math.cos(slope) + Math.sin(zenith)*Math.sin(slope)*Math.cos(azimuth - aspect);
      ill = Math.max(0, Math.min(1, ill));

      // Measure relative to flat ground so flats stay paper-coloured and only
      // real slopes register. rel>0 = in shadow, rel<0 = catching the light.
      const rel = (illFlat - ill)/illFlat;

      if(rel >= 0){
        const alpha = Math.max(0, Math.min(1, rel*strength));
        img.data[idx]   = shadowRGB[0];
        img.data[idx+1] = shadowRGB[1];
        img.data[idx+2] = shadowRGB[2];
        img.data[idx+3] = Math.round(255*alpha);
      } else {
        const alpha = Math.max(0, Math.min(1, -rel*highlight));
        img.data[idx]   = 255;
        img.data[idx+1] = 255;
        img.data[idx+2] = 255;
        img.data[idx+3] = Math.round(255*alpha);
      }
    }
  }
  octx.putImageData(img,0,0);
  return out.toDataURL('image/png');
}

/* ---------------- units ---------------- */
function makeUnits(system){
  const imperial = system === 'imperial';
  return {
    imperial,
    dist:      km => imperial ? km*0.621371 : km,
    distShort: imperial ? 'MI' : 'KM',
    distLong:  imperial ? 'MILES' : 'KILOMETERS',
    elev:      m  => imperial ? m*3.28084 : m,
    elevShort: imperial ? 'FT' : 'M'
  };
}

/* ---------------- shared layout ---------------- */
/* Both the renderer and the terrain fetch need identical geometry, so it lives in one place.
   If these ever drift apart, the hillshade stops lining up with the route. */
const REF_W = 1600, REF_H = 2400; // baseline portrait (2:3) design the layout was tuned against
function computeCanvasSize(aspect){
  const a = aspect || {w:2,h:3};
  let W,H;
  if(a.w <= a.h){ H = REF_H; W = REF_H * (a.w/a.h); }       // portrait or square: fix height
  else { W = REF_H; H = REF_H * (a.h/a.w); }                 // landscape: fix width
  return {W,H};
}

/* Day columns get cramped past ~7 across, so wrap them into rows. Every column is the
   SAME width across every row — stretching each row to fill the width instead makes the
   column rhythm change from row to row, which reads as a mistake rather than a choice.
   Full rows come first; the short last row is centred when the leftover slots divide
   evenly either side, and left-aligned when they don't. */
const FOOTER_MAX_PER_ROW = 7;
function footerGrid(nDays){
  const rows = Math.max(1, Math.ceil(nDays / FOOTER_MAX_PER_ROW));
  const perRow = Math.ceil(nDays / rows);
  const sizes = [];
  for(let r=0;r<rows;r++) sizes.push(Math.min(perRow, nDays - r*perRow));
  const lastCount = sizes[sizes.length-1];
  const empty = perRow - lastCount;
  // an odd number of empty slots can't be split evenly, so don't fake it — left-align
  const lastOffset = (empty > 0 && empty % 2 === 0) ? empty/2 : 0;
  return { rows, perRow, sizes, lastOffset };
}

function computeLayout(rides, proj, aspect, framePad, elevMode){
  const {W,H} = computeCanvasSize(aspect);
  const s = Math.min(W,H)/REF_W;
  const MARGIN_X = W*0.0875;
  // Title-block chrome (above the map) and elevation+footer chrome (below the map) each have an
  // intrinsic height driven by font scale 's', not by canvas height H — so anchor both to 's',
  // then let the map fill whatever vertical space is left between them.
  // Files without <ele> (common from phone exports) get no elevation profile, so the
  // map reclaims that band instead of leaving a blank strip.
  const dataHasElev = rides.some(r => r.hasElevation === undefined ? true : r.hasElevation);
  const hasElev = (elevMode === 'off') ? false : dataHasElev;

  // Extra footer rows eat into the map, not off the bottom of the page.
  const grid = footerGrid(rides.length > 1 ? rides.length : 0);
  const rowH = 78*s;
  const footerExtra = (grid.rows - 1) * rowH;
  const MAP_TOP = 520*s, MAP_BOTTOM = H - (hasElev ? 550 : 300)*s - footerExtra;
  const map_w = W - 2*MARGIN_X, map_h = MAP_BOTTOM - MAP_TOP;

  const allPts = rides.flatMap(r=>r.points);
  const projPts = allPts.map(p=>proj.project(p.lat,p.lon));
  const [minx, maxx] = extent(projPts.map(p=>p[0]));
  const [miny, maxy] = extent(projPts.map(p=>p[1]));
  const geo_w = maxx-minx, geo_h = maxy-miny;
  // framePad: how much the route is inset from the map edge. Smaller = more surrounding
  // terrain visible, placing the route in wider geographic context.
  const fill = framePad ?? 0.94;
  const scale = Math.min(map_w/geo_w, map_h/geo_h) * fill;
  const off_x = MARGIN_X + (map_w - geo_w*scale)/2;
  const off_y = MAP_TOP + (map_h - geo_h*scale)/2;

  const toSvg = (lat,lon)=>{
    const [x,y] = proj.project(lat,lon);
    return [ off_x + (x-minx)*scale, off_y + (maxy-y)*scale ];
  };
  const toSvgProj = (x,y)=>[ off_x + (x-minx)*scale, off_y + (maxy-y)*scale ];
  const invProject = (sx,sy)=>{
    const x = (sx - off_x)/scale + minx;
    const y = maxy - (sy - off_y)/scale;
    return [ y, x/proj.cosLat ];
  };

  return {W,H,s,MARGIN_X,MAP_TOP,MAP_BOTTOM,map_w,map_h,minx,maxx,miny,maxy,scale,off_x,off_y,toSvg,toSvgProj,invProject,hasElev,footerRows:grid.rows,footerPerRow:grid.perRow,footerSizes:grid.sizes,footerLastOffset:grid.lastOffset,footerRowH:rowH,footerExtra};
}

/* Geographic bounds of the *drawn map rectangle* (not just the route) — terrain must
   cover this whole area or the poster shows blank bands at the edges. */
function mapRectBounds(rides, proj, aspect, padFrac, framePad, elevMode){
  const L = computeLayout(rides, proj, aspect, framePad, elevMode);
  const corners = [
    L.invProject(L.MARGIN_X, L.MAP_TOP),
    L.invProject(L.MARGIN_X + L.map_w, L.MAP_TOP),
    L.invProject(L.MARGIN_X, L.MAP_BOTTOM),
    L.invProject(L.MARGIN_X + L.map_w, L.MAP_BOTTOM)
  ];
  const [minLat, maxLat] = extent(corners.map(c=>c[0]));
  const [minLon, maxLon] = extent(corners.map(c=>c[1]));
  const pf = padFrac ?? 0.03;
  const pLat = (maxLat-minLat)*pf || 0.01;
  const pLon = (maxLon-minLon)*pf || 0.01;
  return { minLat:minLat-pLat, maxLat:maxLat+pLat, minLon:minLon-pLon, maxLon:maxLon+pLon };
}

/* ---------------- main SVG renderer ---------------- */
function renderPosterSVG(rides, proj, grid, paletteName, titleOverride, subtitleOverride, aspect, unitSystem, framePad, waterMode, vec, elevMode, roadMode, renderOpts){
  const U = makeUnits(unitSystem);
  const L = computeLayout(rides, proj, aspect, framePad, elevMode);
  const {W,H,s,MARGIN_X,MAP_TOP,MAP_BOTTOM,map_w,map_h,minx,maxx,miny,maxy,scale,off_x,off_y} = L;
  const {toSvg, toSvgProj, invProject, hasElev, footerRows, footerPerRow, footerSizes, footerLastOffset, footerRowH, footerExtra} = L;
  const pal = getPalette(paletteName);
  // exact inverse of toSvg comes from computeLayout (shared with terrain fetch)

  /* ---- simplified day paths (with per-point svg coords + elevation for gradient) ---- */
  // One path per recording segment: a paused or dropped-out track must not be joined
  // by a straight line across the gap.
  const daySegPaths = rides.map(r=>{
    const segs = (r.segments && r.segments.length) ? r.segments : [r.points];
    return segs.map(seg=>{
      const xy = seg.map(p=>proj.project(p.lat,p.lon));
      const simp = rdp(xy, 0.00003);
      return simp.map(([x,y])=>toSvgProj(x,y));
    }).filter(pts=>pts.length>0);
  });
  // A one-point track still needs start/finish markers, so keep short segments here and
  // skip them only when emitting <path> geometry.
  const dayPaths = daySegPaths.map(segs=>segs.flat()).filter(p=>p.length>0);

  const dayStartEnd = dayPaths.map(p=>[p[0], p[p.length-1]]);

  /* ---- elevation profile from real GPX elevation ---- */
  let cum = 0;
  const profile = [];
  const dayBreaks = [];
  rides.forEach(r=>{
    const segs = (r.segments && r.segments.length) ? r.segments : [r.points];
    const totalPts = segs.reduce((a,sg)=>a+sg.length, 0);
    const step = Math.max(1, Math.floor(totalPts/900));
    // accumulate within each segment only, so a gap adds no distance to the x-axis
    segs.forEach(seg=>{
      const sampled = [];
      for(let i=0;i<seg.length;i+=step) sampled.push(seg[i]);
      if(sampled[sampled.length-1] !== seg[seg.length-1]) sampled.push(seg[seg.length-1]);
      for(let i=0;i<sampled.length;i++){
        if(i>0) cum += haversine(sampled[i-1].lat, sampled[i-1].lon, sampled[i].lat, sampled[i].lon)/1000;
        profile.push([cum, sampled[i].ele]);
      }
    });
    dayBreaks.push(cum);
  });
  const totalDist = cum;
  const elevs = profile.map(p=>p[1]);
  const [minElev, maxElev] = extent(elevs);

  const FOOT = hasElev ? 0 : -275;   // pull the footer up into the reclaimed space
  const EL_TOP = MAP_BOTTOM + 100*s, EL_BOTTOM = MAP_BOTTOM + 290*s;
  const el_w = W - 2*MARGIN_X;
  function elXY(dist, elev){
    const x = MARGIN_X + (dist/totalDist)*el_w;
    const y = EL_BOTTOM - ((elev-minElev)/(maxElev-minElev))*(EL_BOTTOM-EL_TOP);
    return [x,y];
  }
  const elPts = profile.map(([d,e])=>elXY(d,e));
  const elLine = "M " + elPts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" L ");
  const elArea = elLine + ` L ${elPts[elPts.length-1][0].toFixed(1)},${EL_BOTTOM.toFixed(1)} L ${elPts[0][0].toFixed(1)},${EL_BOTTOM.toFixed(1)} Z`;
  const elTicks = dayBreaks.slice(0,-1).map(db => MARGIN_X + (db/totalDist)*el_w);

  /* ---- stats ---- */
  const stats = rides.map(rideStats);
  const totalKm = stats.reduce((s,r)=>s+r.distanceKm,0);
  const totalGain = stats.reduce((s,r)=>s+r.gainM,0);
  const nDays = rides.length;
  const firstDate = rides[0].startTime ? new Date(rides[0].startTime) : null;
  const lastDate = rides[nDays-1].startTime ? new Date(rides[nDays-1].startTime) : null;
  let dateStr = '';
  if(firstDate && lastDate){
    const months = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
    const sameDay = firstDate.getUTCFullYear()===lastDate.getUTCFullYear()
                 && firstDate.getUTCMonth()===lastDate.getUTCMonth()
                 && firstDate.getUTCDate()===lastDate.getUTCDate();
    if(sameDay){
      dateStr = `${months[firstDate.getUTCMonth()]} ${firstDate.getUTCDate()}, ${firstDate.getUTCFullYear()}`;
    } else if(firstDate.getUTCFullYear()===lastDate.getUTCFullYear() && firstDate.getUTCMonth()===lastDate.getUTCMonth()){
      dateStr = `${months[firstDate.getUTCMonth()]} ${firstDate.getUTCDate()}\u2013${lastDate.getUTCDate()}, ${firstDate.getUTCFullYear()}`;
    } else {
      dateStr = `${months[firstDate.getUTCMonth()]} ${firstDate.getUTCDate()} \u2013 ${months[lastDate.getUTCMonth()]} ${lastDate.getUTCDate()}, ${lastDate.getUTCFullYear()}`;
    }
  }

  // A single-day outing shouldn't advertise "1 DAY" or repeat itself in a per-day breakdown.
  const multiDay = nDays > 1;
  const climbBit = hasElev ? `  \u00b7  ${Math.round(U.elev(totalGain)).toLocaleString()} ${U.elevShort} CLIMBED` : '';
  const headStats = multiDay
    ? `${U.dist(totalKm).toFixed(0)} ${U.distShort}  \u00b7  ${nDays} DAYS${climbBit}`
    : `${U.dist(totalKm).toFixed(0)} ${U.distShort}${climbBit}`;

  const title = (titleOverride || 'YOUR ROUTE').toUpperCase();
  const subtitle = subtitleOverride ? subtitleOverride.toUpperCase() : '';

  /* ---- vector features: roads, places, and authoritative water polygons ---- */
  const spanKmForStyle = haversine(...invProject(MARGIN_X, MAP_BOTTOM), ...invProject(MARGIN_X+map_w, MAP_BOTTOM))/1000;
  const showRoads = !!vec && (roadMode === undefined ? true : roadMode !== 'off');
  const vf = vec ? extractVectorFeatures(vec,
                     showRoads ? roadClassesForSpan(spanKmForStyle) : [],
                     showRoads ? placeClassesForSpan(spanKmForStyle) : [])
                 : { roads:[], water:[], places:[] };

  // Water polygons in SVG coordinates — these are OSM's actual coastlines and lakes, which
  // settle land-vs-water without guessing from elevation.
  const waterPolysSvg = vf.water.map(ring => ring.map(([lon,lat]) => toSvg(lat,lon)));

  const roadsSvg = vf.roads.map(r => {
    const pts = r.pts.map(([lon,lat]) => toSvg(lat,lon));
    // cheap reject: skip anything entirely outside the map rect
    let inside = false;
    for(const [x,y] of pts){
      if(x >= MARGIN_X-50 && x <= MARGIN_X+map_w+50 && y >= MAP_TOP-50 && y <= MAP_BOTTOM+50){ inside = true; break; }
    }
    if(!inside) return '';
    const w = (ROAD_WEIGHT[r.cls] ?? 0.4) * 1.35 * s;
    const op = (ROAD_WEIGHT[r.cls] ?? 0.4) * 0.55 + 0.12;
    const d = 'M ' + pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L ');
    return `<path d="${d}" fill="none" stroke="${pal.ink}" stroke-width="${w.toFixed(2)}" opacity="${op.toFixed(2)}" stroke-linecap="round" stroke-linejoin="round"/>`;
  }).filter(Boolean).join('\n');

  // Places: a small dot plus a label, biggest settlements first, thinned so they don't collide.
  const placeParts = [];
  const placed = [];
  const sortedPlaces = vf.places.slice().sort((a,b)=>{
    const rank = c => c==='city'?0 : c==='town'?1 : 2;
    return rank(a.cls)-rank(b.cls) || (a.rank-b.rank);
  });
  for(const pl of sortedPlaces){
    if(!pl.name) continue;
    const [x,y] = toSvg(pl.lat, pl.lon);
    if(x < MARGIN_X+4 || x > MARGIN_X+map_w-4 || y < MAP_TOP+4 || y > MAP_BOTTOM-4) continue;
    const minGap = 92*s;
    if(placed.some(q => Math.hypot(q[0]-x, q[1]-y) < minGap)) continue;
    placed.push([x,y]);
    if(placed.length > 14) break;
    const r = (pl.cls==='city' ? 3.2 : pl.cls==='town' ? 2.4 : 1.9) * s;
    const fs2 = (pl.cls==='city' ? 15 : pl.cls==='town' ? 13 : 11.5) * s;
    const label = String(pl.name).toUpperCase().replace(/[<>&]/g,'');
    placeParts.push(
      `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}" fill="${pal.ink}" opacity="0.75"/>` +
      `<text x="${(x+r+5*s).toFixed(1)}" y="${(y+fs2*0.34).toFixed(1)}" font-size="${fs2.toFixed(1)}" letter-spacing="${(1.2*s).toFixed(2)}" fill="${pal.mute}">${label}</text>`
    );
  }
  const placesSvg = placeParts.join('\n');

  /* ---- terrain layer: hillshade raster from the DEM ---- */
  let hillshadeSvg = '';
  let usedTerrainSource = null;

  if(grid && grid.isTerrain){
    // real DEM raster -> grayscale hillshade, resampled into poster space
    // width of the mapped area in metres, for correct slope scaling
    const [swLat, swLon] = invProject(MARGIN_X, MAP_BOTTOM);
    const [seLat, seLon] = invProject(MARGIN_X+map_w, MAP_BOTTOM);
    const spanMetres = haversine(swLat, swLon, seLat, seLon) || 60000;

    // Derive sea level from the route itself. If the track runs below 0 m — polders,
    // Death Valley, the Dead Sea — then land demonstrably exists down there, so push the
    // waterline below the lowest point the rider actually reached. Mountain routes keep
    // the default and behave exactly as before.
    // With no elevation in the GPX every point reads as 0 m, which is not evidence
    // that the route is at sea level — fall back to the default waterline.
    const seaLevel = hasElev ? ((minElev < 2) ? (minElev - 2) : 0.5) : 0.5;

    const uri = buildHillshadeDataURI(grid, invProject, MARGIN_X, MAP_TOP, map_w, map_h, {
      azimuth:315, altitude:45, strength:0.62, waterAlpha:0.10,
      shadowRGB:[32,33,31], waterRGB:[32,33,31],
      spanMetres, seaLevel, waterMode,
      routePixels: dayPaths.flat(),
      waterPolysSvg: waterPolysSvg,
      // size the terrain raster to the pixels it will actually occupy in the export
      maxDim: (renderOpts && renderOpts.outputScale)
        ? Math.min(3200, Math.round(Math.max(map_w, map_h) * renderOpts.outputScale))
        : undefined
    });
    hillshadeSvg = `<image x="${MARGIN_X.toFixed(1)}" y="${MAP_TOP.toFixed(1)}" width="${map_w.toFixed(1)}" height="${map_h.toFixed(1)}" href="${uri}" xlink:href="${uri}" preserveAspectRatio="none"/>`;
    usedTerrainSource = 'dem';
  }

  /* ---- route paths ---- */
  // A paused recording (ferry, transit, lunch) leaves a gap between segments. Draw a
  // connector so the route reads as one continuous journey, but dashed — and the distance
  // is still excluded from every total, because rideStats only measures within segments.
  const gapConnectors = daySegPaths.map((segs, i)=>{
    const color = pal.dayColor(i, daySegPaths.length);
    const parts = [];
    for(let k=1;k<segs.length;k++){
      const prev = segs[k-1], next = segs[k];
      if(!prev.length || !next.length) continue;
      const a = prev[prev.length-1], b = next[0];
      if(Math.hypot(a[0]-b[0], a[1]-b[1]) < 3*s) continue;   // paused in place: nothing to draw
      parts.push(`<path d="M ${a[0].toFixed(1)},${a[1].toFixed(1)} L ${b[0].toFixed(1)},${b[1].toFixed(1)}" `
        + `fill="none" stroke="${color}" stroke-width="${(2.1*s).toFixed(2)}" opacity="0.5" `
        + `stroke-dasharray="${(10*s).toFixed(1)} ${(8*s).toFixed(1)}" stroke-linecap="round"/>`);
    }
    return parts.join("\n");
  }).filter(Boolean).join("\n");

  const routeParts = daySegPaths.map((segs, i)=>{
    const color = pal.dayColor(i, daySegPaths.length);
    return segs.filter(pts=>pts.length>1).map(pts=>{
      const d = "M " + pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" L ");
      return `<path d="${d}" fill="none" stroke="${color}" stroke-width="${(3.5*s).toFixed(2)}" stroke-linecap="round" stroke-linejoin="round"/>`;
    }).join("\n");
  }).join("\n");

  const haveGeom = dayStartEnd.length > 0 && dayStartEnd[0][0] && dayStartEnd[dayStartEnd.length-1][1];
  const startPt = haveGeom ? dayStartEnd[0][0] : [MARGIN_X+map_w/2, MAP_TOP+map_h/2];
  const finishPt = haveGeom ? dayStartEnd[dayStartEnd.length-1][1] : startPt;
  const flip = startPt[0] > (W - MARGIN_X - 220*s);
  const anchor = flip ? 'end' : 'start';
  const lx = flip ? startPt[0]-20*s : startPt[0]+20*s;
  const lx2 = flip ? finishPt[0]-20*s : finishPt[0]+20*s;

  const junctionMarkers = dayStartEnd.slice(1).map(([st,e])=>
    `<circle cx="${st[0].toFixed(1)}" cy="${st[1].toFixed(1)}" r="${(4*s).toFixed(2)}" fill="${pal.paper}" stroke="${pal.ink}" stroke-width="${(1.5*s).toFixed(2)}"/>`
  ).join("\n");

  const footerLineY = MAP_BOTTOM + (335+FOOT)*s, footerDayY = MAP_BOTTOM + (375+FOOT)*s, footerKmY = MAP_BOTTOM + (405+FOOT)*s, footerGainY = MAP_BOTTOM + (429+FOOT)*s;

  const footerCols = multiDay ? rides.map((r,i)=>{
    const row = Math.floor(i / footerPerRow);
    let col = i % footerPerRow;
    // uniform column width everywhere; only the short last row shifts
    if(row === footerRows-1) col += footerLastOffset;
    const cw = (W-2*MARGIN_X)/footerPerRow;
    const cx = MARGIN_X + cw*col + cw/2;
    const dy = row * footerRowH;
    const st = stats[i];
    return `
      <text x="${cx.toFixed(1)}" y="${(footerDayY+dy).toFixed(1)}" text-anchor="middle" font-size="${(15*s).toFixed(1)}" letter-spacing="${(1.5*s).toFixed(2)}" fill="${pal.mute}">DAY ${i+1}</text>
      <text x="${cx.toFixed(1)}" y="${(footerKmY+dy).toFixed(1)}" text-anchor="middle" font-size="${(19*s).toFixed(1)}" fill="${pal.ink}">${U.dist(st.distanceKm).toFixed(0)} ${U.distShort}</text>
      ${hasElev ? `<text x="${cx.toFixed(1)}" y="${(footerGainY+dy).toFixed(1)}" text-anchor="middle" font-size="${(14*s).toFixed(1)}" fill="${pal.mute}">+${Math.round(U.elev(st.gainM)).toLocaleString()} ${U.elevShort}</text>` : ''}`;
  }).join("\n") : '';

  const credits = [];
  if(usedTerrainSource === 'dem') credits.push('ELEVATION: MAPZEN TERRAIN TILES / AWS OPEN DATA (3DEP, SRTM, GMTED)');
  if(vf.roads.length || vf.water.length || vf.places.length)
    credits.push('MAP DATA \u00a9 OPENSTREETMAP CONTRIBUTORS, VIA OPENMAPTILES / OPENFREEMAP');
  const creditLine = credits.join('   \u00b7   ');

  const subtitleY = 220*s, titleY = 320*s, ruleY = 368*s, dateY = 415*s, statsY = 465*s, bottomY = MAP_BOTTOM + (480+FOOT)*s + footerExtra;
  const inset1 = 60*s, inset2 = 72*s;

  const svg = `
<svg viewBox="0 0 ${W.toFixed(1)} ${H.toFixed(1)}" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="${W.toFixed(1)}" height="${H.toFixed(1)}" fill="${pal.paper}"/>
  <rect x="${inset1.toFixed(1)}" y="${inset1.toFixed(1)}" width="${(W-2*inset1).toFixed(1)}" height="${(H-2*inset1).toFixed(1)}" fill="none" stroke="${pal.ink}" stroke-width="${(1.5*s).toFixed(2)}" opacity="0.5"/>
  <rect x="${inset2.toFixed(1)}" y="${inset2.toFixed(1)}" width="${(W-2*inset2).toFixed(1)}" height="${(H-2*inset2).toFixed(1)}" fill="none" stroke="${pal.ink}" stroke-width="${s.toFixed(2)}" opacity="0.3"/>

  ${subtitle ? `<text x="${W/2}" y="${subtitleY.toFixed(1)}" text-anchor="middle" font-size="${(30*s).toFixed(1)}" letter-spacing="${(10*s).toFixed(2)}" fill="${pal.mute}">${subtitle}</text>` : ''}
  <text x="${W/2}" y="${titleY.toFixed(1)}" text-anchor="middle" font-size="${((title.length>18?70:92)*s).toFixed(1)}" font-weight="bold" letter-spacing="${(6*s).toFixed(2)}" fill="${pal.ink}">${title}</text>
  <line x1="${(W/2-260*s).toFixed(1)}" y1="${ruleY.toFixed(1)}" x2="${(W/2+260*s).toFixed(1)}" y2="${ruleY.toFixed(1)}" stroke="${pal.ink}" stroke-width="${(1.5*s).toFixed(2)}"/>
  ${dateStr ? `<text x="${W/2}" y="${dateY.toFixed(1)}" text-anchor="middle" font-size="${(26*s).toFixed(1)}" letter-spacing="${(5*s).toFixed(2)}" fill="${pal.mute}">${dateStr}</text>` : ''}
  <text x="${W/2}" y="${statsY.toFixed(1)}" text-anchor="middle" font-size="${(22*s).toFixed(1)}" letter-spacing="${(4*s).toFixed(2)}" fill="${pal.mute}">${headStats}</text>

  <clipPath id="mapClip"><rect x="${MARGIN_X.toFixed(1)}" y="${MAP_TOP.toFixed(1)}" width="${map_w.toFixed(1)}" height="${map_h.toFixed(1)}"/></clipPath>
  <g clip-path="url(#mapClip)">${hillshadeSvg}${showRoads ? roadsSvg : ''}${showRoads ? placesSvg : ''}</g>

  ${gapConnectors}
  ${routeParts}
  <circle cx="${startPt[0].toFixed(1)}" cy="${startPt[1].toFixed(1)}" r="${(9*s).toFixed(2)}" fill="${pal.paper}" stroke="${pal.ink}" stroke-width="${(2.5*s).toFixed(2)}"/>
  <circle cx="${finishPt[0].toFixed(1)}" cy="${finishPt[1].toFixed(1)}" r="${(6*s).toFixed(2)}" fill="${pal.ink}"/>
  <text x="${lx.toFixed(1)}" y="${(startPt[1]-14*s).toFixed(1)}" text-anchor="${anchor}" font-size="${(18*s).toFixed(1)}" letter-spacing="${(2*s).toFixed(2)}" fill="${pal.mute}">START</text>
  <text x="${lx2.toFixed(1)}" y="${(finishPt[1]+30*s).toFixed(1)}" text-anchor="${anchor}" font-size="${(18*s).toFixed(1)}" letter-spacing="${(2*s).toFixed(2)}" fill="${pal.mute}">FINISH</text>
  ${junctionMarkers}

  ${hasElev ? `<line x1="${MARGIN_X.toFixed(1)}" y1="${EL_BOTTOM.toFixed(1)}" x2="${(W-MARGIN_X).toFixed(1)}" y2="${EL_BOTTOM.toFixed(1)}" stroke="${pal.ink}" stroke-width="${s.toFixed(2)}" opacity="0.6"/>
  <path d="${elArea}" fill="${pal.ink}" opacity="0.08"/>
  <path d="${elLine}" fill="none" stroke="${pal.ink}" stroke-width="${(2*s).toFixed(2)}"/>
  ${elTicks.map(x=>`<line x1="${x.toFixed(1)}" y1="${EL_TOP.toFixed(1)}" x2="${x.toFixed(1)}" y2="${(EL_BOTTOM+8*s).toFixed(1)}" stroke="${pal.mute}" stroke-width="${s.toFixed(2)}" opacity="0.6"/>`).join("\n")}
  <text x="${MARGIN_X.toFixed(1)}" y="${(EL_TOP-14*s).toFixed(1)}" font-size="${(16*s).toFixed(1)}" letter-spacing="${(2*s).toFixed(2)}" fill="${pal.mute}">ELEVATION PROFILE</text>
  <text x="${(W-MARGIN_X).toFixed(1)}" y="${(EL_TOP-14*s).toFixed(1)}" text-anchor="end" font-size="${(16*s).toFixed(1)}" letter-spacing="${(2*s).toFixed(2)}" fill="${pal.mute}">${Math.round(U.elev(maxElev)).toLocaleString()} ${U.elevShort} PEAK</text>` : ''}

  ${multiDay ? `<line x1="${MARGIN_X.toFixed(1)}" y1="${footerLineY.toFixed(1)}" x2="${(W-MARGIN_X).toFixed(1)}" y2="${footerLineY.toFixed(1)}" stroke="${pal.ink}" stroke-width="${s.toFixed(2)}" opacity="0.4"/>` : ''}
  ${footerCols}
  ${creditLine ? `<text x="${W/2}" y="${bottomY.toFixed(1)}" text-anchor="middle" font-size="${(9.5*s).toFixed(1)}" letter-spacing="${(1.2*s).toFixed(2)}" fill="${pal.mute}" opacity="0.75">${creditLine}</text>` : ''}
</svg>`;
  return svg;
}

/* ---------------- download handlers ---------------- */
document.getElementById('downloadSvg').addEventListener('click', ()=>{
  const svgEl = posterWrap.querySelector('svg');
  if(!svgEl) return;
  const blob = new Blob([svgEl.outerHTML], {type:'image/svg+xml'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'route-poster.svg';
  a.click();
});

document.getElementById('downloadPng').addEventListener('click', ()=>{
  const onScreen = posterWrap.querySelector('svg');
  if(!onScreen) return;
  const btn = document.getElementById('downloadPng');
  const targetLong = parseInt(document.getElementById('pngSizeSelect').value, 10);
  const [vbW0, vbH0] = onScreen.getAttribute('viewBox').split(' ').slice(2).map(Number);
  const scale = targetLong / Math.max(vbW0, vbH0);

  // The hillshade is a raster baked into the SVG; blowing it up alongside crisp vector
  // text looks soft. For large exports, re-render the terrain to match the output size.
  let svgData;
  if(scale > 1.05 && LAST_RENDER){
    const wasLabel = btn.textContent;
    btn.disabled = true; btn.textContent = 'Rendering…';
    const r = LAST_RENDER;
    svgData = renderPosterSVG(r.rides, r.proj, r.grid, r.palette, r.titleOverride, r.subtitleOverride,
      r.aspect, r.unitSystem, r.framePad, r.waterMode, r.vec, r.elevMode, r.roadMode,
      { outputScale: scale });
    btn.disabled = false; btn.textContent = wasLabel;
  } else {
    svgData = new XMLSerializer().serializeToString(onScreen);
  }

  const svgBlob = new Blob([svgData], {type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(svgBlob);
  const img = new Image();
  img.onload = ()=>{
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(vbW0 * scale);
    canvas.height = Math.round(vbH0 * scale);
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);
    canvas.toBlob(blob=>{
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `route-poster-${canvas.width}x${canvas.height}.png`;
      a.click();
    });
  };
  img.src = url;
});
</script>
</body>
